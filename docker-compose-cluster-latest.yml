services:

  # ── NameNode ────────────────────────────────────────────────────────────────
  namenode:
    build: .
    hostname: namenode
    container_name: namenode
    command: ["hdfs", "namenode"]
    ports:
      - 9870:9870
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    healthcheck:
      # Le NameNode est "healthy" uniquement quand il est sorti du safe mode
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get 2>/dev/null | grep -q 'Safe mode is OFF'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # ── DataNodes ───────────────────────────────────────────────────────────────
  datanode1:
    build: .
    hostname: datanode1
    container_name: datanode1
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    depends_on:
      namenode:
        condition: service_started

  datanode2:
    build: .
    hostname: datanode2
    container_name: datanode2
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    depends_on:
      namenode:
        condition: service_started

  datanode3:
    build: .
    hostname: datanode3
    container_name: datanode3
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    depends_on:
      namenode:
        condition: service_started

  # ── ResourceManager ─────────────────────────────────────────────────────────
  resourcemanager:
    build: .
    hostname: resourcemanager
    container_name: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - 8088:8088
    env_file:
      - ./config
    volumes:
      - ./test.sh:/opt/test.sh
    depends_on:
      namenode:
        condition: service_started

  # ── NodeManagers ─────────────────────────────────────────────────────────────
  nodemanager1:
    build: .
    hostname: nodemanager1
    container_name: nodemanager1
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config
    depends_on:
      namenode:
        condition: service_started

  nodemanager2:
    build: .
    hostname: nodemanager2
    container_name: nodemanager2
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config
    depends_on:
      namenode:
        condition: service_started

  nodemanager3:
    build: .
    hostname: nodemanager3
    container_name: nodemanager3
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config
    depends_on:
      namenode:
        condition: service_started

  # ── Tez Init (one-shot) ──────────────────────────────────────────────────────
  # Ce service s'exécute une seule fois au démarrage du cluster.
  # Il attend que le NameNode soit healthy (safe mode OFF),
  # puis uploade le tarball Tez sur HDFS. Il s'arrête ensuite proprement.
  tez-init:
    build: .
    hostname: tez-init
    container_name: tez-init
    command: ["/bin/bash", "/opt/init-tez.sh"]
    env_file:
      - ./config
    volumes:
      - ./init-tez.sh:/opt/init-tez.sh:ro
    depends_on:
      namenode:
        condition: service_healthy
    restart: "no"
